{{ define "main" }}

<main id="primary">
  <section class="content clearfix">

    <section class="block">
      <article class="page">

        <header>
          <h1>404 – Page Not Found</h1>
        </header>

        <div class="fullPost clearfix">

          <p>
            Sorry, the page you requested could not be found.
          </p>

          <p>
            It may have been moved, renamed, or the link may be incorrect.
          </p>

          <p>
            <a href="/">Return to the home page</a>
            &nbsp;•&nbsp;
            <a href="/news/">Browse News</a>
            &nbsp;•&nbsp;
            <a href="/search/">Search the site</a>
          </p>

          <hr>

          <p><em>Error 404</em></p>

        </div>

      </article>
    </section>

  </section>
</main>

<script>
(function () {
  // If the URL contains a stable content id (e.g. /news/n000104/wrong-slug/
  // or /news/n000104/), look it up in /id-map.json and redirect to its
  // current canonical URL. Handles renamed/changed slugs gracefully.
  var m = location.pathname.match(/\/([a-z]\d{6})(?:\/|$)/);
  if (!m) return;
  var id = m[1];

  fetch('/id-map.json')
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (data) {
      if (!data) return;
      var match = data.find(function (item) { return item.id === id; });
      if (match && match.url) {
        location.replace(match.url);
      }
    })
    .catch(function () {
      // id-map.json unavailable; fall back to the static 404 message above.
    });
})();
</script>

{{ end }}
