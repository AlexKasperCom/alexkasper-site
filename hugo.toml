baseURL = 'https://test.alexkasper.com/'
languageCode = 'en-us'
title = 'Alex Kasper'
[pagination]
  pagerSize = 15

[taxonomies]
tag = "tags"

[server]
  [[server.redirects]]
    from = "/**"
    to = "/404.html"
    status = 404
    
[[menus.main]]
name = "About"
pageRef = "/about"
weight = 10

[[menus.main]]
name = "Press"
pageRef = "/press"
weight = 20

[[menus.main]]
name = "News"
pageRef = "/news"
weight = 30

[[menus.main]]
name = "Events"
pageRef = "/events"
weight = 40

[[menus.main]]
name = "Projects"
pageRef = "/projects"
weight = 50

[[menus.main]]
name = "Contact"
pageRef = "/contact"
weight = 80


[permalinks]
  [permalinks.page]
    news = '/news/:contentbasename/:slug/'
    events = '/events/:contentbasename/:slug/'
    projects = '/projects/:contentbasename/:slug/'

# Emits /id-map.json at build time: a flat list of every content item's
# stable `id` (front matter) paired with its current canonical URL.
# Used by layouts/404.html to redirect stale/incorrect slugs
# (e.g. /news/n000104/wrong-slug/) to the item's current URL.
[outputFormats.IDMap]
  mediaType = "application/json"
  baseName = "id-map"
  isPlainText = true
  notAlternative = true

# Emits archive.json alongside a project page's index.html: a structured,
# machine-readable index of every entry tagged with that project (e.g. all
# 98 TAP/Classified TAP entries for the TAP Archive project page), so an
# agent or script can fetch one file instead of crawling and parsing every
# individual page. Opt in per-page via `outputs: ["html", "archiveindex"]`
# in front matter (see content/projects/p000008/index.md) — most projects
# don't have a back-issues-style archive and don't need this.
[outputFormats.ArchiveIndex]
  mediaType = "application/json"
  baseName = "archive"
  isPlainText = true
  notAlternative = true

[outputs]
  home = ["HTML", "IDMap"]